name: 1 - Coletor
on:
  schedule:
    # O agendador do GitHub atrasa o coletor em 90-190 min, entao os horarios
    # sao antecipados para que a coleta caia sempre ANTES do publicador.
    # Tres passagens por dia: se a arte chegar tarde no Telegram, a passagem
    # seguinte pega. Rodar varias vezes e seguro porque, sem conteudo novo,
    # a fila atual e preservada.
    - cron: '10 06 * * *'
    - cron: '10 11 * * *'
    - cron: '10 17 * * *'
  workflow_dispatch:
jobs:
  run-coletor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python src/coletor.py
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TELEGRAM_CONTENT_CHAT_ID: ${{ secrets.TELEGRAM_CONTENT_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Salvar Imagens e JSON no Repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git add database/
          git commit -m "Auto: Fila de posts diários salva" || exit 0
          git push
