name: 2 - Publicador (alvo: 08h, 12h, 18h BRT)
on:
  schedule:
    # Alvo 08:00 BRT. O agendador do GitHub atrasa 60-105 min, entao o cron
    # e antecipado para compensar. Minutos "impopulares" (:17, :23) sofrem
    # menos fila do que :00 e :45.
    - cron: '17 09 * * *'
    # Alvo 12:00 BRT
    - cron: '17 13 * * *'
    # Alvo 18:00 BRT
    - cron: '23 19 * * *'
  workflow_dispatch:
jobs:
  run-publicador:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python src/publicador.py
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Atualizar JSON marcando postado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git add database/
          git commit -m "Auto: Post publicado no Instagram" || exit 0
          git push
